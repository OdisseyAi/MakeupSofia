<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Салон красоты: Макияж</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    height: 100vh; overflow: hidden;
    background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
    font-family: 'Nunito', sans-serif;
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
  }

  #canvas-container {
    position: relative;
    width: 100%;
    flex-grow: 1;
    display: flex; justify-content: center; align-items: center;
    overflow: hidden;
    touch-action: none;
  }

  #viewport {
    position: absolute;
    top: 50%; left: 50%;
    transform-origin: center center;
    will-change: transform;
  }

  canvas#gameCanvas {
    position: relative;
    display: block;
    touch-action: none;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    background: #fff;
  }

  #toolbar {
    width: 100%;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-top-left-radius: 25px;
    border-top-right-radius: 25px;
    padding: 12px 10px 20px 10px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
    z-index: 10;
  }

  #colors {
    display: flex; justify-content: center; gap: 10px;
    overflow-x: auto; padding: 4px;
  }

  .color-btn {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid #fff;
    box-shadow: 0 3px 6px rgba(0,0,0,0.15);
    flex-shrink: 0;
    transition: transform 0.15s;
    cursor: pointer;
  }
  .color-btn.active { transform: scale(1.2); border-color: #ffb6c1; }

  #tools {
    display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
  }

  .tool-btn {
    background: #f0f4f8; border: none; border-radius: 16px;
    padding: 9px 13px; font-size: 14px; font-weight: 700; color: #5a6b7c;
    display: flex; align-items: center; gap: 6px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    cursor: pointer; transition: all 0.2s;
    font-family: 'Nunito', sans-serif;
  }
  .tool-btn.active { background: #ffb6c1; color: #fff; box-shadow: 0 4px 10px rgba(255,182,193,0.4); }

  #sizeRow {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 13px; color: #8a97a3; font-weight: 700;
  }
  #sizeRow input[type=range] { width: 140px; accent-color: #ffb6c1; }

  #top-controls {
    position: absolute; top: 16px; right: 16px;
    display: flex; flex-direction: column; gap: 8px; z-index: 10;
  }
  #zoom-controls {
    position: absolute; top: 16px; left: 16px;
    display: flex; flex-direction: column; gap: 8px; z-index: 10;
  }
  .icon-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: #fff; border: none;
    box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    font-size: 20px; display: flex; justify-content: center; align-items: center;
    cursor: pointer; transition: transform 0.15s;
    padding: 0;
  }
  .icon-btn:active { transform: scale(0.88); }
  .icon-btn.on { background: #ffb6c1; color: #fff; }

  #hint {
    position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.55); color: #fff; font-size: 12px; font-weight: 700;
    padding: 6px 14px; border-radius: 20px; white-space: nowrap;
    opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 10;
  }
  #hint.show { opacity: 1; }
</style>
</head>
<body>

  <div id="canvas-container">
    <div id="viewport">
      <canvas id="gameCanvas"></canvas>
    </div>

    <div id="zoom-controls">
      <button class="icon-btn" id="btnZoomIn" title="Приблизить">🔍+</button>
      <button class="icon-btn" id="btnZoomOut" title="Отдалить">🔍-</button>
      <button class="icon-btn" id="btnPan" title="Режим перемещения">✋</button>
    </div>

    <div id="top-controls">
      <button class="icon-btn" id="btnUndo" title="Отменить">↩️</button>
      <button class="icon-btn" id="btnNext" title="Следующая модель">➡️</button>
    </div>

    <div id="hint">Два пальца — зум и перемещение</div>
  </div>

  <div id="toolbar">
    <div id="colors"></div>
    <div id="tools">
      <button class="tool-btn active" data-tool="brush">💄 Помада</button>
      <button class="tool-btn" data-tool="eyes">✨ Тени</button>
      <button class="tool-btn" data-tool="blush">🌸 Румяна</button>
      <button class="tool-btn" data-tool="liner">🖊️ Лайнер</button>
      <button class="tool-btn" data-tool="eraser">🧽 Ластик</button>
    </div>
    <div id="sizeRow">
      <span>Размер кисти</span>
      <input type="range" id="brushSizeSlider" min="4" max="50" value="12">
    </div>
  </div>

<script>
/* placeholder - full script injected next */
</script>
</body>
</html>
