<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Фея Лира и лунный сад</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--plum:#1a0b3d;--pink:#ff5fa2;--mint:#7ff3d0;--gold:#ffd86b;--lilac:#b9a2ff;--font:"Fredoka","Trebuchet MS",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--plum);font-family:var(--font);color:#fff;touch-action:none;user-select:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
  #goals{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(26,11,61,.55);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.25);font-weight:600;font-size:16px;transition:.25s}
  .chip.done{background:rgba(127,243,208,.3);border-color:var(--mint)}
  #lives{font-size:24px;letter-spacing:2px;filter:drop-shadow(0 0 8px #ff5fa2)}
  #lvl{position:fixed;left:0;right:0;top:max(58px,calc(env(safe-area-inset-top) + 46px));text-align:center;font-size:15px;opacity:.85;pointer-events:none;text-shadow:0 0 10px #000a}
  #ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 40%,rgba(26,11,61,.35),rgba(26,11,61,.85));transition:opacity .4s}
  #ov.hide{opacity:0;pointer-events:none}
  .card{max-width:420px;text-align:center}
  h1{font-size:clamp(34px,8vw,54px);line-height:1.05;font-weight:600;background:linear-gradient(90deg,var(--gold),var(--pink),var(--lilac),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,95,162,.6))}
  p{margin:14px 0 22px;font-size:18px;line-height:1.4;opacity:.92}
  button{font:600 22px var(--font);color:#3a0f4f;padding:14px 38px;border:0;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,var(--gold),#ff9ccc);box-shadow:0 0 0 4px rgba(255,255,255,.2),0 10px 40px rgba(255,95,162,.6);transition:transform .15s}
  button:hover{transform:scale(1.06)}button:active{transform:scale(.96)}
  button:focus-visible{outline:3px solid #fff;outline-offset:4px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="goals"></div><div id="lives"></div></div>
<div id="lvl"></div>
<div id="ov"><div class="card"><h1 id="t">Фея Лира и лунный сад</h1><p id="s">Веди фею пальцем или мышкой и собирай звёзды. Обходи сонные грозовые тучки!</p><button id="b">Играть</button></div></div>

<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,U;
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);U=Math.max(26,Math.min(W,H)*.055)}
addEventListener('resize',rs);rs();

/* ---------- Уровни и задания ---------- */
const LEVELS=[
 {name:'Первые звёзды',goal:{star:10},speed:1,cloud:.12,crystal:0},
 {name:'Радужные кристаллы',goal:{star:8,crystal:3},speed:1.15,cloud:.18,crystal:.14},
 {name:'Грозовая ночь',goal:{star:12,crystal:4},speed:1.3,cloud:.28,crystal:.14},
 {name:'Королева лунного сада',goal:{star:15,crystal:6},speed:1.5,cloud:.32,crystal:.16}
];
const ICON={star:'⭐',crystal:'💎'};

/* ---------- Состояние ---------- */
let st='menu',lv=0,lives=3,got={},items=[],parts=[],floats=[],t=0,spawn=0,inv=0,shake=0,combo=0;
const fairy={x:0,y:0,tx:0,ty:0,vx:0};
const keys={};
const bg={stars:Array.from({length:90},()=>({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.6+.4,p:Math.random()*6})),
 orbs:Array.from({length:14},()=>({x:Math.random(),y:Math.random(),r:Math.random()*40+18,s:Math.random()*.02+.005,h:Math.random()*360}))};

/* ---------- Звук ---------- */
let ac;
function tone(f,d=.15,type='sine',v=.07){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const chime=n=>{tone(660+n*70,.18);setTimeout(()=>tone(990+n*90,.22),70)};

/* ---------- HUD ---------- */
const goalsEl=document.getElementById('goals'),livesEl=document.getElementById('lives'),lvlEl=document.getElementById('lvl');
function hud(){
 const L=LEVELS[lv];
 goalsEl.innerHTML=Object.keys(L.goal).map(k=>{const d=(got[k]||0)>=L.goal[k];return `<div class="chip ${d?'done':''}">${ICON[k]} ${Math.min(got[k]||0,L.goal[k])} / ${L.goal[k]}</div>`}).join('');
 livesEl.textContent='💗'.repeat(lives)+'🖤'.repeat(3-lives);
 lvlEl.textContent=`Уровень ${lv+1}: ${L.name}`;
}

/* ---------- Управление ---------- */
function setT(e){fairy.tx=e.clientX;fairy.ty=e.clientY-U*1.2}
addEventListener('pointermove',e=>{if(st==='play')setT(e)});
addEventListener('pointerdown',e=>{if(st==='play')setT(e)});
addEventListener('keydown',e=>{keys[e.key]=1});addEventListener('keyup',e=>{keys[e.key]=0});

/* ---------- Игровая логика ---------- */
function startLevel(n){
 lv=n;got={};items=[];parts=[];floats=[];lives=3;combo=0;inv=0;
 fairy.x=fairy.tx=W/2;fairy.y=fairy.ty=H*.75;st='play';spawn=0;hud();
 document.getElementById('ov').classList.add('hide');
}
function overlay(t_,s_,btn,fn){
 document.getElementById('t').textContent=t_;document.getElementById('s').textContent=s_;
 const b=document.getElementById('b');b.textContent=btn;b.onclick=()=>{tone(520,.1);fn()};
 document.getElementById('ov').classList.remove('hide');
}
function burst(x,y,hue,n=18,sp=4){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp+1;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,d:.02+Math.random()*.02,r:Math.random()*3+1.5,h:hue+Math.random()*40-20})}}
function say(x,y,txt,col){floats.push({x,y,txt,col,life:1})}
function spawnItem(){
 const L=LEVELS[lv],r=Math.random();let type='star';
 if(r<L.cloud)type='cloud';else if(r<L.cloud+L.crystal)type='crystal';else if(lives<3&&Math.random()<.06)type='heart';
 const rad=type==='cloud'?U*1.1:U*.62;
 items.push({type,x:rad+Math.random()*(W-rad*2),y:-rad*2,r:rad,vy:(1.6+Math.random()*1.2)*L.speed*(U/34),ph:Math.random()*6,rot:0});
}
function check(){
 const L=LEVELS[lv];
 if(Object.keys(L.goal).every(k=>(got[k]||0)>=L.goal[k])){
  st='won';tone(784,.2);setTimeout(()=>tone(988,.2),150);setTimeout(()=>tone(1318,.4),300);
  for(let i=0;i<6;i++)setTimeout(()=>burst(Math.random()*W,Math.random()*H*.6,Math.random()*360,30,6),i*160);
  setTimeout(()=>{
   if(lv<LEVELS.length-1)overlay('Уровень пройден! ✨',`Ты великолепна! Дальше: «${LEVELS[lv+1].name}»`,'Дальше',()=>startLevel(lv+1));
   else overlay('Ты — королева сада! 👑','Все звёзды собраны, лунный сад снова сияет. Сыграем ещё раз?','Сначала',()=>startLevel(0));
  },1500);
 }
}
function update(){
 t+=.016;
 if(st!=='play'&&st!=='won'){fairy.x+=(W/2+Math.sin(t)*W*.2-fairy.x)*.03;fairy.y+=(H*.6+Math.cos(t*1.3)*H*.08-fairy.y)*.03}
 if(st==='play'){
  const k=U*.4;
  if(keys.ArrowLeft||keys.a)fairy.tx-=k;if(keys.ArrowRight||keys.d)fairy.tx+=k;
  if(keys.ArrowUp||keys.w)fairy.ty-=k;if(keys.ArrowDown||keys.s)fairy.ty+=k;
  fairy.tx=Math.max(U,Math.min(W-U,fairy.tx));fairy.ty=Math.max(U*2,Math.min(H-U,fairy.ty));
  const ox=fairy.x;fairy.x+=(fairy.tx-fairy.x)*.18;fairy.y+=(fairy.ty-fairy.y)*.18;fairy.vx=fairy.x-ox;
  spawn-=1;if(spawn<=0){spawnItem();spawn=48/LEVELS[lv].speed*(.7+Math.random()*.6)}
  if(inv>0)inv--;
  for(const it of items){
   it.y+=it.vy;it.rot+=.03;it.x+=Math.sin(t*2+it.ph)*.6;
   const dx=it.x-fairy.x,dy=it.y-fairy.y;
   if(!it.dead&&Math.hypot(dx,dy)<it.r+U*.55){
    it.dead=true;
    if(it.type==='cloud'){
     if(inv<=0){lives--;inv=80;shake=14;combo=0;tone(150,.35,'sawtooth',.08);burst(it.x,it.y,270,16,3);say(it.x,it.y,'Ой!','#c9b6ff');
      if(lives<=0){st='over';setTimeout(()=>overlay('Тучки победили 🌧️','Не грусти! Попробуй ещё раз — ты почти справилась.','Ещё раз',()=>startLevel(lv)),700)}}
    }else if(it.type==='heart'){lives=Math.min(3,lives+1);burst(it.x,it.y,340,22);say(it.x,it.y,'+💗','#ff9ccc');tone(880,.3)}
    else{combo++;const n=it.type==='star'?1:1;got[it.type]=(got[it.type]||0)+n;burst(it.x,it.y,it.type==='star'?50:Math.random()*360,it.type==='star'?16:26);
     say(it.x,it.y,combo>=5?`+1 ×${Math.floor(combo/5)+1}`:'+1',it.type==='star'?'#ffd86b':'#7ff3d0');chime(Math.min(combo,8));}
    hud();if(st==='play')check();
   }
  }
  items=items.filter(i=>!i.dead&&i.y<H+i.r*2);
  if(Math.random()<.9)parts.push({x:fairy.x-fairy.vx*2+(Math.random()-.5)*U*.4,y:fairy.y+U*.5,vx:(Math.random()-.5)*.8,vy:Math.random()*1.2+.4,life:1,d:.025,r:Math.random()*2.6+1,h:300+Math.random()*80});
 }
 for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.02;p.life-=p.d}parts=parts.filter(p=>p.life>0);
 for(const f of floats){f.y-=1.1;f.life-=.025}floats=floats.filter(f=>f.life>0);
 if(shake>0)shake--;
}

/* ---------- Рисование ---------- */
function glow(x,y,r,c,a=1){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c.replace('A',a));g.addColorStop(1,c.replace('A',0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill()}
function starPath(x,y,R,r,rot){ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,q=i%2?r:R;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*q,y+Math.sin(a)*q)}ctx.closePath()}
function drawBg(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12062e');g.addColorStop(.45,'#4a1a85');g.addColorStop(.8,'#c4479a');g.addColorStop(1,'#ff9a8b');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(const s of bg.stars){ctx.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.5+s.p));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill()}
 ctx.globalAlpha=1;
 const mx=W*.78,my=H*.2,mr=Math.min(W,H)*.09;
 glow(mx,my,mr*4,'rgba(255,230,250,A)',.35);
 ctx.fillStyle='#fff6e0';ctx.beginPath();ctx.arc(mx,my,mr,0,6.283);ctx.fill();
 ctx.fillStyle='rgba(230,200,220,.5)';[[-.3,-.2,.22],[.25,.15,.3],[-.1,.4,.15]].forEach(c=>{ctx.beginPath();ctx.arc(mx+c[0]*mr,my+c[1]*mr,c[2]*mr,0,6.283);ctx.fill()});
 ctx.globalCompositeOperation='lighter';
 for(const o of bg.orbs){const x=((o.x*W+t*o.s*W*2)%(W+200))-100,y=(o.y*H+Math.sin(t+o.h)*20);glow(x,y,o.r,`hsla(${o.h},90%,70%,A)`,.14)}
 ctx.globalCompositeOperation='source-over';
 const hills=[['#3a1670',.74,.05,.6,.25],['#2a0f55',.82,.07,1,.4],['#170838',.9,.06,1.6,.6]];
 hills.forEach(([c,y0,amp,sp,ph],i)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+10;x+=10)ctx.lineTo(x,H*y0+Math.sin(x*.004*(i+1)+ph*6+t*.05*sp)*H*amp);ctx.lineTo(W,H);ctx.fill()});
 // светящиеся цветы на переднем плане
 for(let i=0;i<9;i++){const x=(i+.5)/9*W,y=H*.95+Math.sin(i*2)*H*.015,s=Math.sin(t*2+i)*.2+1;glow(x,y-U*.3,U*1.1*s,'rgba(127,243,208,A)',.35);ctx.fillStyle=i%2?'#ff7ac0':'#9ff7e0';ctx.beginPath();ctx.arc(x,y-U*.3,U*.13,0,6.283);ctx.fill()}
}
function drawItem(it){
 const {x,y,r}=it;
 if(it.type==='star'){
  ctx.globalCompositeOperation='lighter';glow(x,y,r*2.6,'rgba(255,216,107,A)',.55);ctx.globalCompositeOperation='source-over';
  const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'#fffbe0');g.addColorStop(1,'#ffc43d');
  ctx.fillStyle=g;starPath(x,y,r,r*.48,it.rot);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.5;ctx.stroke();
 }else if(it.type==='crystal'){
  const h=(t*120+it.ph*60)%360;
  ctx.globalCompositeOperation='lighter';glow(x,y,r*3,`hsla(${h},100%,65%,A)`,.6);ctx.globalCompositeOperation='source-over';
  ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(it.rot)*.25);
  const g=ctx.createLinearGradient(-r,-r,r,r);g.addColorStop(0,`hsl(${h},100%,85%)`);g.addColorStop(.5,`hsl(${h+60},90%,65%)`);g.addColorStop(1,`hsl(${h+140},90%,60%)`);
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,-r*1.2);ctx.lineTo(r*.85,-r*.2);ctx.lineTo(0,r*1.2);ctx.lineTo(-r*.85,-r*.2);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.beginPath();ctx.moveTo(-r*.85,-r*.2);ctx.lineTo(r*.85,-r*.2);ctx.moveTo(0,-r*1.2);ctx.lineTo(0,r*1.2);ctx.stroke();ctx.restore();
 }else if(it.type==='heart'){
  ctx.globalCompositeOperation='lighter';glow(x,y,r*2.5,'rgba(255,95,162,A)',.6);ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#ff5fa2';ctx.beginPath();ctx.moveTo(x,y+r*.9);ctx.bezierCurveTo(x-r*1.5,y-r*.1,x-r*.7,y-r*1.1,x,y-r*.35);ctx.bezierCurveTo(x+r*.7,y-r*1.1,x+r*1.5,y-r*.1,x,y+r*.9);ctx.fill();
 }else{
  ctx.fillStyle='#3a2a74';ctx.strokeStyle='#8f7ae0';ctx.lineWidth=2;
  ctx.beginPath();[[-.7,.2,.55],[-.2,-.2,.7],[.4,-.05,.6],[.8,.25,.45],[0,.35,.65]].forEach(c=>{ctx.moveTo(x+c[0]*r+c[2]*r,y+c[1]*r);ctx.arc(x+c[0]*r,y+c[1]*r,c[2]*r,0,6.283)});ctx.fill();
  ctx.fillStyle='#1a0b3d';[-.35,.3].forEach(e=>{ctx.beginPath();ctx.arc(x+e*r,y+.05*r,r*.1,0,6.283);ctx.fill()});
  ctx.strokeStyle='#1a0b3d';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y+r*.55,r*.2,3.5,5.9);ctx.stroke();
  ctx.fillStyle='rgba(255,230,120,.8)';ctx.beginPath();ctx.moveTo(x+r*.1,y+r*.8);ctx.lineTo(x-r*.15,y+r*1.15);ctx.lineTo(x+r*.05,y+r*1.12);ctx.lineTo(x-r*.1,y+r*1.5);ctx.lineTo(x+r*.25,y+r*1);ctx.lineTo(x+r*.08,y+r*1.02);ctx.fill();
 }
}
function drawFairy(){
 if(inv>0&&Math.floor(inv/5)%2)ctx.globalAlpha=.4;
 const x=fairy.x,y=fairy.y+Math.sin(t*5)*3,s=U,tilt=Math.max(-.4,Math.min(.4,fairy.vx*.05));
 ctx.globalCompositeOperation='lighter';glow(x,y,s*3,'rgba(255,150,220,A)',.45);ctx.globalCompositeOperation='source-over';
 ctx.save();ctx.translate(x,y);ctx.rotate(tilt);
 const fl=Math.sin(t*22);
 [-1,1].forEach(d=>{
  ctx.save();ctx.scale(d,1);
  const g=ctx.createLinearGradient(0,0,s*1.5,-s);g.addColorStop(0,'rgba(190,255,245,.85)');g.addColorStop(1,'rgba(200,160,255,.45)');
  ctx.fillStyle=g;ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.2;
  ctx.save();ctx.rotate(-.5+fl*.18);ctx.beginPath();ctx.ellipse(s*.75,-s*.25,s*.75,s*.34,-.4,0,6.283);ctx.fill();ctx.stroke();ctx.restore();
  ctx.save();ctx.rotate(.35-fl*.12);ctx.beginPath();ctx.ellipse(s*.6,s*.2,s*.5,s*.24,.5,0,6.283);ctx.fill();ctx.stroke();ctx.restore();
  ctx.restore();
 });
 // волосы сзади
 ctx.fillStyle='#ffb347';ctx.beginPath();ctx.ellipse(0,-s*.55,s*.42,s*.46,0,0,6.283);ctx.fill();
 ctx.beginPath();ctx.ellipse(-s*.3,-s*.1,s*.2,s*.45,.2,0,6.283);ctx.ellipse(s*.3,-s*.1,s*.2,s*.45,-.2,0,6.283);ctx.fill();
 // платье
 const dg=ctx.createLinearGradient(0,-s*.2,0,s*.9);dg.addColorStop(0,'#ff7ac0');dg.addColorStop(1,'#a56bff');
 ctx.fillStyle=dg;ctx.beginPath();ctx.moveTo(-s*.2,-s*.2);ctx.lineTo(s*.2,-s*.2);ctx.lineTo(s*.55,s*.85);ctx.quadraticCurveTo(0,s*1.05,-s*.55,s*.85);ctx.fill();
 // голова
 ctx.fillStyle='#ffe3d3';ctx.beginPath();ctx.arc(0,-s*.5,s*.33,0,6.283);ctx.fill();
 ctx.fillStyle='#ffb347';ctx.beginPath();ctx.ellipse(0,-s*.72,s*.36,s*.2,0,3.3,6.1);ctx.fill();
 ctx.fillStyle='#4a2160';[-.13,.13].forEach(e=>{ctx.beginPath();ctx.ellipse(e*s,-s*.48,s*.045,s*.065,0,0,6.283);ctx.fill()});
 ctx.fillStyle='rgba(255,110,150,.55)';[-.22,.22].forEach(e=>{ctx.beginPath();ctx.arc(e*s,-s*.38,s*.07,0,6.283);ctx.fill()});
 ctx.strokeStyle='#c2406f';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,-s*.4,s*.08,.2,2.9);ctx.stroke();
 // корона
 ctx.fillStyle='#ffd86b';ctx.beginPath();ctx.moveTo(-s*.2,-s*.8);ctx.lineTo(-s*.12,-s*1);ctx.lineTo(0,-s*.84);ctx.lineTo(s*.12,-s*1);ctx.lineTo(s*.2,-s*.8);ctx.fill();
 // волшебная палочка
 ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s*.3,s*.2);ctx.lineTo(s*.85,-s*.35);ctx.stroke();
 ctx.fillStyle='#fff7b0';starPath(s*.9,-s*.4,s*.18,s*.08,t*3);ctx.fill();
 ctx.restore();ctx.globalAlpha=1;
}
function draw(){
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 drawBg();
 for(const it of items)drawItem(it);
 ctx.globalCompositeOperation='lighter';
 for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);glow(p.x,p.y,p.r*3.2,`hsla(${p.h},100%,70%,A)`,.9)}
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 drawFairy();
 ctx.textAlign='center';ctx.font=`600 ${U*.7}px Fredoka,"Trebuchet MS",sans-serif`;
 for(const f of floats){ctx.globalAlpha=Math.max(0,f.life);ctx.fillStyle=f.col;ctx.strokeStyle='rgba(26,11,61,.8)';ctx.lineWidth=4;ctx.strokeText(f.txt,f.x,f.y);ctx.fillText(f.txt,f.x,f.y)}
 ctx.globalAlpha=1;ctx.restore();
}
function loop(){update();draw();requestAnimationFrame(loop)}

document.getElementById('b').onclick=()=>{tone(520,.1);startLevel(0)};
hud();document.getElementById('lvl').textContent='';
fairy.x=W/2;fairy.y=H*.6;
loop();
})();
</script>
</body>
</html>
