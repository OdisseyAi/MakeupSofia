<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Фея Лира и лунный сад</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--plum:#1a0b3d;--pink:#ff5fa2;--mint:#7ff3d0;--gold:#ffd86b;--lilac:#b9a2ff;--font:"Fredoka","Trebuchet MS",system-ui,sans-serif}
  *{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--plum);font-family:var(--font);color:#fff;touch-action:none;user-select:none}
  canvas{position:fixed;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block}
  #hud{position:fixed;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
  #goals{display:flex;gap:8px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(26,11,61,.55);backdrop-filter:blur(8px);border:1.5px solid rgba(255,255,255,.25);font-weight:600;font-size:16px;transition:.25s}
  .chip.done{background:rgba(127,243,208,.3);border-color:var(--mint)}
  #lives{font-size:24px;letter-spacing:2px;filter:drop-shadow(0 0 8px #ff5fa2)}
  #lvl{position:fixed;left:0;right:0;top:max(58px,calc(env(safe-area-inset-top) + 46px));text-align:center;font-size:15px;opacity:.85;pointer-events:none;text-shadow:0 0 10px #000a}
  #ov{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 40%,rgba(26,11,61,.35),rgba(26,11,61,.85));transition:opacity .4s}
  #ov.hide{opacity:0;pointer-events:none}
  .card{max-width:420px;text-align:center}
  h1{font-size:clamp(34px,8vw,54px);line-height:1.05;font-weight:600;background:linear-gradient(90deg,var(--gold),var(--pink),var(--lilac),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(255,95,162,.6))}
  p{margin:14px 0 22px;font-size:18px;line-height:1.4;opacity:.92}
  button{font:600 22px var(--font);color:#3a0f4f;padding:14px 38px;border:0;border-radius:999px;cursor:pointer;background:linear-gradient(135deg,var(--gold),#ff9ccc);box-shadow:0 0 0 4px rgba(255,255,255,.2),0 10px 40px rgba(255,95,162,.6);transition:transform .15s}
  button:hover{transform:scale(1.06)}button:active{transform:scale(.96)}
  button:focus-visible{outline:3px solid #fff;outline-offset:4px}
  button.sec{margin:16px auto 0;font-size:17px;padding:10px 26px;color:#fff;background:rgba(255,255,255,.16);box-shadow:none;border:1.5px solid rgba(255,255,255,.4)}
  #row{display:flex;flex-wrap:wrap;justify-content:center;margin-top:12px}#row .sec{margin:4px 5px}
  #pn{position:fixed;top:0;right:0;bottom:0;left:0;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(18,6,46,.9);backdrop-filter:blur(6px);transition:opacity .3s;z-index:5}
  #pn.hide{opacity:0;pointer-events:none}
  .pnc{width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;text-align:center}
  #pt{font-size:19px;font-weight:600;margin-bottom:10px}
  #pg{overflow:auto;touch-action:pan-y;display:grid;gap:8px;padding:4px;grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
  #pg.sk{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .cell{font:600 16px var(--font);color:#fff;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:2px}
  .cell b{font-size:18px}.cell span{font-size:12px}.cell i{font-size:11px;opacity:.7;font-style:normal}
  .cell.lock{opacity:.4;cursor:default}.cell.on{border-color:var(--gold);background:rgba(255,216,107,.25)}.cell:hover{transform:none}
  .chip{margin:0 8px 8px 0}
  #pz{position:fixed;right:12px;top:max(52px,calc(env(safe-area-inset-top) + 42px));width:44px;height:44px;padding:0;font-size:18px;border-radius:50%;color:#fff;background:rgba(26,11,61,.55);border:1.5px solid rgba(255,255,255,.3);box-shadow:none}
  .lite .chip,.lite #pn{backdrop-filter:none;-webkit-backdrop-filter:none}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="goals"></div><div id="lives"></div></div>
<div id="lvl"></div>
<button id="pz" aria-label="Пауза">⏸</button>
<div id="ov"><div class="card"><h1 id="t">Фея Лира и лунный сад</h1><p id="s">Веди фею пальцем или мышкой, собирай звёзды и кристаллы. Обходи грозовые тучки и пройди все 100 уровней в десяти волшебных мирах!</p><button id="b">Играть</button><div id="row"><button class="sec" id="bl">🗺 Уровни</button><button class="sec" id="bs">🎭 Герои</button><button class="sec" id="bq">⚙ Графика</button></div></div></div>

<div id="pn" class="hide"><div class="pnc"><div id="pt"></div><div id="pg"></div><button class="sec" id="pb">Назад</button></div></div>
<script>
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR,U,LITE=false;
function rs(){DPR=LITE?1:Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);U=Math.max(26,Math.min(W,H)*.055)}
addEventListener('resize',rs);rs();

/* ---------- Уровни и задания ---------- */
const WORLDS=[
 {name:'Лунный сад',sky:['#12062e','#4a1a85','#c4479a','#ff9a8b'],hills:['#3a1670','#2a0f55','#170838'],moon:'#fff6e0'},
 {name:'Ледяное королевство',sky:['#06173d','#14508f','#4fb6d9','#c9f4ff'],hills:['#1d5a8f','#12406e','#0a2547'],moon:'#e8fbff'},
 {name:'Закатные облака',sky:['#2b0f4a','#a23a8c','#ff7a6b','#ffd08a'],hills:['#8a2f7a','#5e1f6a','#35104a'],moon:'#fff0c8'},
 {name:'Изумрудный лес',sky:['#05221f','#0f5f4f','#2fb88a','#b9f5a8'],hills:['#146b55','#0d4a40','#06302b'],moon:'#f4ffd8'},
 {name:'Звёздная галактика',sky:['#07031a','#2a0b6b','#8a1fa8','#ff5fa2'],hills:['#4b1a8f','#2f0f66','#16063a'],moon:'#ffe6fb'},
 {name:'Сладкое королевство',sky:['#3a0f4f','#c2478f','#ff9ac4','#fff0c9'],hills:['#e86fa8','#c14a8a','#8a2d6a'],moon:'#fff8e8'},
 {name:'Жемчужное море',sky:['#021a33','#075a7a','#17b3b0','#9ef0d6'],hills:['#0d7f8a','#0a5a6e','#063a4d'],moon:'#e8fffb'},
 {name:'Радужный карнавал',sky:['#1f0a52','#6a2bd1','#ff5fa2','#ffe14d'],hills:['#9a45e0','#6a2bb0','#401a7a'],moon:'#fff7c2'},
 {name:'Хрустальный дворец',sky:['#0b1240','#3d4fb8','#9db4ff','#f2e6ff'],hills:['#6b7fe0','#4658b8','#2a3680'],moon:'#ffffff'},
 {name:'Небесное королевство',sky:['#2c3a8c','#6aa5ff','#ffd3a6','#fff6d0'],hills:['#ffc1d6','#f08fb8','#b85a96'],moon:'#fffbe0'}
];
/* 100 уровней. 1–50 как раньше; с 51: кометы и награды, с 61: колючие шарики, с 71: ветер */
function makeLevel(n){
 const num=n+1,bonus=num%5===0&&num%10!==0,boss=num%10===0,w=Math.floor(n/10);
 const L={world:w,speed:Math.min(n<50?1.7:1.85,1+n*.015),cloud:Math.min(n<50?.24:.26,.10+n*.003),crystal:n===0?0:.13,goal:{star:Math.min(24,8+Math.floor(n*.28))}};
 if(n>0)L.goal.crystal=Math.min(8,2+Math.floor(n*.1));
 if(n>=4){L.speed=Math.min(1.95,L.speed*1.08);L.cloud=Math.min(.28,L.cloud+.03);L.goal.star+=1}
 if(n>=50){L.comet=Math.min(.11,.03+(n-50)*.0016);L.pow=.05}
 if(n>=60)L.thorn=Math.min(.08,.025+(n-60)*.0014);
 if(n>=70)L.wind=Math.min(1.5,.5+(n-70)*.035);
 if(n>=50)L.cloud=Math.max(.1,L.cloud-(L.comet||0)-(L.thorn||0));
 L.name=WORLDS[w].name;
 if(bonus){L.name='Дождь из кристаллов';L.cloud=n>=4?.07:.04;L.comet=L.thorn=L.wind=0;L.crystal=.4;L.speed*=.9;L.goal={star:7,crystal:Math.min(14,6+Math.floor(n*.12))}}
 if(boss){L.name='Испытание';L.cloud+=.04;L.speed*=1.05}
 if(num===50)L.name='Корона королевы';
 if(num===100)L.name='Небесная корона';
 return L;
}
const LEVELS=Array.from({length:100},(_,i)=>makeLevel(i));
const HAZ={cloud:1,comet:1,thorn:1};
const INTRO={50:'☄️ Кометы! Лови 🛡️ щиты и 🧲 магниты',60:'Колючие шарики качаются в стороны',70:'Дует ветер — держи курс!'};
const SKINS=[
 {name:'Лира',need:0,perk:'Корона, 3 сердечка',hair:'#ffb347',d1:'#ff7ac0',d2:'#a56bff',w1:'rgba(190,255,245,.85)',w2:'rgba(200,160,255,.45)',acc:'#ffd86b'},
 {name:'Нова',need:25,perk:'Звёзды чуть притягиваются',hair:'#cfe8ff',d1:'#6fe3ff',d2:'#4a6bff',w1:'rgba(200,240,255,.9)',w2:'rgba(130,170,255,.5)',acc:'#ffffff',mag:1},
 {name:'Роза',need:50,perk:'4 сердечка',hair:'#9c3b2e',d1:'#ff5a7a',d2:'#c2185b',w1:'rgba(255,200,215,.9)',w2:'rgba(255,120,170,.5)',acc:'#ff8fb0',L:4},
 {name:'Аврора',need:75,perk:'Щит в начале уровня',rb:1,w1:'rgba(255,255,255,.9)',w2:'rgba(255,200,255,.5)',acc:'#fff',sh:1},
 {name:'Луна',need:100,perk:'Долгая защита после удара',hair:'#5a3fa0',d1:'#7b4bd8',d2:'#1c0f4f',w1:'rgba(255,230,255,.9)',w2:'rgba(160,120,255,.5)',acc:'#fff1a8',inv:140},
 {name:'Бип',ic:'🤖',kind:'robot',need:10,perk:'Классический робот',c1:'#9db4d6',c2:'#4a5f85',c3:'#5cf2ff',gl:'rgba(90,220,255,A)'},
 {name:'Молния',ic:'⚡',kind:'hero',need:30,perk:'4 сердечка',c1:'#2f6bff',c2:'#e5283c',c3:'#ffe14d',gl:'rgba(255,225,80,A)',L:4,em:'bolt',cape:1},
 {name:'Титан',ic:'🦾',kind:'robot',need:60,perk:'Щит в начале уровня',c1:'#e05252',c2:'#7a1f2a',c3:'#ffd24d',gl:'rgba(255,120,80,A)',sh:1,big:1},
 {name:'Космо',ic:'🚀',kind:'hero',need:90,perk:'Долгая защита после удара',c1:'#ff8a2b',c2:'#2c3a8c',c3:'#fff3b0',gl:'rgba(120,200,255,A)',inv:140,em:'star',helm:1}
];
const ICON={star:'⭐',crystal:'💎'};

/* ---------- Состояние ---------- */
let paused=false,shield=0,t0=0,maxL=3,mag=0,st='menu',lv=0,lives=3,got={},items=[],parts=[],floats=[],t=0,spawn=0,inv=0,shake=0,combo=0;
const fairy={x:0,y:0,tx:0,ty:0,vx:0};
const keys={};
let S={cnt:0,best:{},skin:0,combo:0,stars:0,q:'auto',al:0};
try{const r=localStorage.getItem('lyra2');if(r)Object.assign(S,JSON.parse(r));else S.cnt=Math.max(0,+localStorage.getItem('lyra_lvl')||0)}catch(e){}
const persist=()=>{try{localStorage.setItem('lyra2',JSON.stringify(S))}catch(e){}};
if(!SKINS[S.skin]||SKINS[S.skin].need>S.cnt)S.skin=0;
const QN={auto:'Авто',max:'Максимум',lite:'Лёгкая'};
function applyQ(){LITE=S.q==='lite'||(S.q==='auto'&&!!S.al);document.body.classList.toggle('lite',LITE);rs();const b=document.getElementById('bq');if(b)b.textContent='⚙ Графика: '+QN[S.q]}
applyQ();
const bg={stars:Array.from({length:90},()=>({x:Math.random(),y:Math.random()*.7,r:Math.random()*1.6+.4,p:Math.random()*6})),
 orbs:Array.from({length:14},()=>({x:Math.random(),y:Math.random(),r:Math.random()*40+18,s:Math.random()*.02+.005,h:Math.random()*360}))};

/* ---------- Звук ---------- */
let ac;
function tone(f,d=.15,type='sine',v=.07){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const chime=n=>{tone(660+n*70,.18);setTimeout(()=>tone(990+n*90,.22),70)};

/* ---------- HUD ---------- */
const goalsEl=document.getElementById('goals'),livesEl=document.getElementById('lives'),lvlEl=document.getElementById('lvl');
function hud(){
 const L=LEVELS[lv];
 goalsEl.innerHTML=Object.keys(L.goal).map(k=>{const d=(got[k]||0)>=L.goal[k];return `<div class="chip ${d?'done':''}">${ICON[k]} ${Math.min(got[k]||0,L.goal[k])} / ${L.goal[k]}</div>`}).join('');
 livesEl.textContent='💗'.repeat(lives)+'🖤'.repeat(maxL-lives)+(shield?' 🛡️':'')+(mag>0?' 🧲':'');
 lvlEl.innerHTML=`Уровень ${lv+1} из 100 · ${L.name}`+(S.best[lv]?` · рекорд ${S.best[lv].s} с`:'')+(INTRO[lv]?`<br>${INTRO[lv]}`:'');
}

/* ---------- Управление ---------- */
function setT(e){fairy.tx=e.clientX;fairy.ty=e.clientY-U*1.2}
addEventListener('pointermove',e=>{if(st==='play'&&!paused)setT(e)});
addEventListener('pointerdown',e=>{if(st==='play'&&!paused)setT(e)});
const tp=e=>{const c=e.touches&&e.touches[0];if(c&&st==='play'&&!paused)setT(c)};
addEventListener('touchstart',tp,{passive:true});
addEventListener('touchmove',e=>{tp(e);if(!(e.target.closest&&e.target.closest('#pg')))e.preventDefault()},{passive:false});
addEventListener('keydown',e=>{keys[e.key]=1});addEventListener('keyup',e=>{keys[e.key]=0});

/* ---------- Игровая логика ---------- */
function startLevel(n){
 lv=n;got={};items=[];parts=[];floats=[];maxL=SKINS[S.skin].L||3;lives=maxL;shield=SKINS[S.skin].sh?1:0;mag=0;t0=t;combo=0;inv=0;
 fairy.x=fairy.tx=W/2;fairy.y=fairy.ty=H*.75;st='play';paused=false;spawn=0;hud();
 if(lv%10===0&&lv>0)say(W/2,H*.35,'Новый мир! '+WORLDS[LEVELS[lv].world].name,'#ffd86b');
 document.getElementById('ov').classList.add('hide');
}
function overlay(t_,s_,btn,fn){
 document.getElementById('t').textContent=t_;document.getElementById('s').textContent=s_;
 const b=document.getElementById('b');b.textContent=btn;b.onclick=()=>{tone(520,.1);fn()};
 document.getElementById('ov').classList.remove('hide');
}
const pn=document.getElementById('pn'),pg=document.getElementById('pg'),pt=document.getElementById('pt');
document.getElementById('pb').onclick=()=>pn.classList.add('hide');
function showLevels(){
 pt.textContent=`Уровни · рекорд серии ×${S.combo} · всего ⭐ ${S.stars}`;pg.className='';
 pg.innerHTML=LEVELS.map((L,i)=>{const o=i<=S.cnt,b=S.best[i];return `<button class="cell ${o?'':'lock'}" data-i="${i}" ${o?'':'disabled'}><b>${i+1}</b><span>${o?(b?'⭐'.repeat(b.r):'новый'):'🔒'}</span>${b?`<i>${b.s} с</i>`:''}</button>`}).join('');
 pg.onclick=e=>{const c=e.target.closest('.cell');if(c&&!c.disabled){pn.classList.add('hide');tone(520,.1);startLevel(+c.dataset.i)}};
 pn.classList.remove('hide');
}
function showSkins(){
 pt.textContent='Герои';pg.className='sk';
 pg.innerHTML=SKINS.map((k,i)=>{const o=k.need<=S.cnt;return `<button class="cell ${i===S.skin?'on':''} ${o?'':'lock'}" data-i="${i}" ${o?'':'disabled'}><b>${k.ic||'🧚'} ${k.name}</b><span>${o?k.perk:'🔒 пройди '+k.need+' ур.'}</span></button>`}).join('');
 pg.onclick=e=>{const c=e.target.closest('.cell');if(c&&!c.disabled){S.skin=+c.dataset.i;persist();showSkins()}};
 pn.classList.remove('hide');
}
function finish(){
 const sec=+(t-t0).toFixed(1),r=lives>=maxL?3:lives>=2?2:1,b=S.best[lv],rec=b&&sec<b.s,old=S.cnt;
 S.best[lv]={r:Math.max(b?b.r:0,r),s:b?Math.min(b.s,sec):sec};S.cnt=Math.max(S.cnt,lv+1);S.stars+=got.star||0;persist();
 const nw=SKINS.filter(k=>k.need>old&&k.need<=S.cnt).map(k=>k.name);
 return '⭐'.repeat(r)+` ${sec} с`+(rec?' · новый рекорд!':'')+(nw.length?` · новый герой: ${nw.join(', ')}!`:'');
}
function burst(x,y,hue,n=18,sp=4){if(LITE)n>>=1;for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp+1;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,d:.02+Math.random()*.02,r:Math.random()*3+1.5,h:hue+Math.random()*40-20})}}
function say(x,y,txt,col){floats.push({x,y,txt,col,life:1})}
function spawnItem(){
 const L=LEVELS[lv],r=Math.random();let type='star';
 const c1=L.cloud,c2=c1+(L.comet||0),c3=c2+(L.thorn||0),c4=c3+L.crystal;
 if(r<c1)type='cloud';else if(r<c2)type='comet';else if(r<c3)type='thorn';else if(r<c4)type='crystal';
 else if(lives<maxL&&Math.random()<.06)type='heart';else if(L.pow&&Math.random()<L.pow)type=Math.random()<.5?'shield':'magnet';
 const rad=type==='cloud'?U*1.1:type==='thorn'?U*.8:U*.62;
 items.push({type,x:rad+Math.random()*(W-rad*2),y:-rad*2,r:rad,vy:(1.6+Math.random()*1.2)*L.speed*(U/34),ph:Math.random()*6,rot:0});
 if(type==='comet'){const c=items[items.length-1];c.vy*=1.6;c.vx=(c.x>W/2?-1:1)*(1.5+Math.random())*U/34}
}
function check(){
 const L=LEVELS[lv];
 if(Object.keys(L.goal).every(k=>(got[k]||0)>=L.goal[k])){
  st='won';const fin=finish();tone(784,.2);setTimeout(()=>tone(988,.2),150);setTimeout(()=>tone(1318,.4),300);
  for(let i=0;i<6;i++)setTimeout(()=>burst(Math.random()*W,Math.random()*H*.6,Math.random()*360,30,6),i*160);
  setTimeout(()=>{
   if(lv<LEVELS.length-1)overlay('Уровень пройден! ✨',`${fin}. Дальше — уровень ${lv+2}: «${LEVELS[lv+1].name}»`,'Дальше',()=>startLevel(lv+1));
   else overlay('Ты — легенда! 👑',`${fin}. Все 100 уровней пройдены! Выбирай любой уровень и бей свои рекорды.`,'Финал ещё раз',()=>startLevel(99));
  },1500);
 }
}
function update(){
 t+=.016;
 if(st!=='play'&&st!=='won'){fairy.x+=(W/2+Math.sin(t)*W*.2-fairy.x)*.03;fairy.y+=(H*.6+Math.cos(t*1.3)*H*.08-fairy.y)*.03}
 if(st==='play'){
  const k=U*.4;
  if(keys.ArrowLeft||keys.a)fairy.tx-=k;if(keys.ArrowRight||keys.d)fairy.tx+=k;
  if(keys.ArrowUp||keys.w)fairy.ty-=k;if(keys.ArrowDown||keys.s)fairy.ty+=k;
  fairy.tx=Math.max(U,Math.min(W-U,fairy.tx));fairy.ty=Math.max(U*2,Math.min(H-U,fairy.ty));
  const ox=fairy.x;fairy.x+=(fairy.tx-fairy.x)*.18;fairy.y+=(fairy.ty-fairy.y)*.18;const wd=LEVELS[lv].wind;if(wd)fairy.x=Math.max(U,Math.min(W-U,fairy.x+Math.sin(t*.8+Math.sin(t*.3)*3)*wd*1.5));if(mag>0&&!--mag)hud();fairy.vx=fairy.x-ox;
  spawn-=1;if(spawn<=0){spawnItem();spawn=48/LEVELS[lv].speed*(.7+Math.random()*.6)}
  if(inv>0)inv--;
  for(const it of items){

 if(!LITE||now-ld>=30){draw();ld=now}
 requestAnimationFrame(loop)}

if(S.cnt>0)overlay('Фея Лира и лунный сад',`Пройдено уровней: ${Math.min(S.cnt,100)} из 100. Продолжим?`,'Продолжить',()=>startLevel(Math.min(99,S.cnt)));
else document.getElementById('b').onclick=()=>{tone(520,.1);startLevel(0)};
hud();document.getElementById('lvl').textContent='';
fairy.x=W/2;fairy.y=H*.6;
document.getElementById('bl').onclick=showLevels;document.getElementById('bs').onclick=showSkins;
document.getElementById('bq').onclick=()=>{S.q=S.q==='auto'?'max':S.q==='max'?'lite':'auto';if(S.q==='max')S.al=0;persist();applyQ()};
function pause(){if(st!=='play'||paused)return;paused=true;overlay('Пауза ⏸','Игра остановлена. Можно сменить героя, уровень или графику.','Продолжить',resume)}
function resume(){paused=false;document.getElementById('ov').classList.add('hide')}
document.getElementById('pz').onclick=pause;
addEventListener('keydown',e=>{if(e.key==='p'||e.key==='P'||e.key==='Escape')paused?resume():pause()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
requestAnimationFrame(loop);
})();
</script>
